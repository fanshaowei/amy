wx:
  miniapp:
    # 小程序配置(必填)
    appid: wx5560514fdc2eea97
    secret: 3bf0ea0290eb8bfa857964844e8207f6
    token: f1d06df7ed8ce53f28f63fb41376cd6d
    aesKey: 56a331f13d3a09e62e9f95b0e25b2bf1
    # 消息格式，XML或者JSON.
    msgDataFormat: JSON
    # 是否使用稳定版 access_token，布尔值只能是 true/false
    use-stable-access-token: false

    # 存储配置redis(可选)
    # 注意: 指定redis.host值后不会使用容器注入的redis连接(JedisPool)
    # 配置类型: Memory(默认), Jedis, RedisTemplate
    # Jedis 需要额外引入 redis.clients:jedis 依赖，当前模块未引入，故使用 RedisTemplate
    config-storage:
      type: RedisTemplate
      # 相关redis前缀配置: wa(默认)
      key-prefix: wa
      redis:
        host: 127.0.0.1
        port: 6379

      # http客户端配置
      # http客户端类型: HttpClient(默认), OkHttp, JoddHttp
      http-client-type: HttpClient
      http-proxy-host:
      http-proxy-port:
      http-proxy-username:
      http-proxy-password:

# spring配置
spring:
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    druid:
      stat-view-servlet:
        enabled: true
        loginUsername: root
        loginPassword: fansw!@#
    dynamic:
      druid:
        initial-size: 5
        min-idle: 5
        maxActive: 20
        maxWait: 60000
        connectTimeout: 30000
        socketTimeout: 60000
        timeBetweenEvictionRunsMillis: 60000
        minEvictableIdleTimeMillis: 300000
        validationQuery: SELECT 1 FROM DUAL
        testWhileIdle: true
        testOnBorrow: false
        testOnReturn: false
        poolPreparedStatements: true
        maxPoolPreparedStatementPerConnectionSize: 20
        filters: stat,slf4j
        connectionProperties: druid.stat.mergeSql\=true;druid.stat.slowSqlMillis\=5000
      datasource:
          # 主库数据源
          master:
            driver-class-name: com.mysql.cj.jdbc.Driver
            url: jdbc:mysql://localhost:3306/amy?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
            username: root
            password: fansw!@#
          # 从库数据源
          # slave:
            # username:
            # password:
            # url:
            # driver-class-name:

  # 临时绕过：根 pom 把 Spring Boot 升到 4.1.1，但 Spring Cloud 仍是 2025.1.1（仅支持 Boot 4.0.x）。
  # 等统一升级 Spring Cloud train 后再删掉。
  # cloud:
  #   compatibility-verifier:
  #     enabled: false

# mybatis配置
mybatis:
    typeAliasesPackage: com.amy.wechat
    mapperLocations: classpath:mapper/**/*.xml

# springdoc配置
springdoc:
