spring:
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              lowerCaseServiceId: true
              enabled: false
          routes:
            # 认证中心
            - id: amy-auth
              uri: lb://amy-auth
              predicates:
                - Path=/auth/**
              filters:
                # 验证码处理
                - name: CacheRequestBody
                  args:
                    bodyClass: java.lang.String
                - ValidateCodeFilter
                - StripPrefix=1
            # 代码生成
            - id: amy-gen
              uri: lb://amy-gen
              predicates:
                - Path=/code/**
              filters:
                - StripPrefix=1
            # 定时任务
            - id: amy-job
              uri: lb://amy-job
              predicates:
                - Path=/schedule/**
              filters:
                - StripPrefix=1
            # 系统模块
            - id: amy-system
              uri: lb://amy-system
              predicates:
                - Path=/system/**
              filters:
                - StripPrefix=1
            # 文件服务
            - id: amy-file
              uri: lb://amy-file
              predicates:
                - Path=/file/**
              filters:
                - StripPrefix=1
            # 太阳宫艺术空间服务
            - id: amy-biz-sun-palace-art-space
              uri: lb://amy-biz-sun-palace-art-space
              predicates:
                - Path=/spas/**
              filters:
                - StripPrefix=1

      # 兜底：即使再出现自循环，也只降级不会拖垮整机
      httpclient:
        connect-timeout: 5000
        response-timeout: 10s
        pool:
          type: FIXED
          max-connections: 500
          max-idle-time: 30000
          max-life-time: 60000

# 安全配置
security:
  # 验证码
  captcha:
    enabled: true
    type: math
  # 防止XSS攻击
  xss:
    enabled: true
    excludeUrls:
      - /system/notice
      - /spas/project/**

  # 不校验白名单
  ignore:
    whites:
      - /auth/logout
      - /auth/login
      - /auth/register
      - /*/v2/api-docs
      - /*/v3/api-docs
      - /csrf
      - /spas/mina/app/**
      # 文件静态资源：游客首页项目封面、小程序 <image> 都不带 token，必须放行。
      # /file/** 路由带 StripPrefix=1，到 amy-file 后实际路径为 <file.prefix>/**。
      # 这里用占位符跟随配置，改前缀时不用同步改白名单字符串。
      - /file/upload/**


# springdoc配置
springdoc:
  webjars:
    # 访问前缀
    prefix:

# 文件资源前缀：网关读不到 amy-file 的 dataId，这里单独声明一份供白名单占位符解析。
# 必须与 amy-file-dev.yml 的 file.prefix 保持一致；若要真正单一真源，
# 可把这一项移到共享 application-dev.yml，两个服务都会继承同一份配置。
file:
  prefix: /statics
