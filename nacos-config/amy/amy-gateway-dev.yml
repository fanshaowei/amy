spring:
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              lowerCaseServiceId: true
              enabled: false
          routes:
            # 认证中心
            - id: amy-auth
              uri: lb://amy-auth
              predicates:
                - Path=/auth/**
              filters:
                # 验证码处理
                - name: CacheRequestBody
                  args:
                    bodyClass: java.lang.String
                - ValidateCodeFilter
                - StripPrefix=1
            # 代码生成
            - id: amy-gen
              uri: lb://amy-gen
              predicates:
                - Path=/code/**
              filters:
                - StripPrefix=1
            # 定时任务
            - id: amy-job
              uri: lb://amy-job
              predicates:
                - Path=/schedule/**
              filters:
                - StripPrefix=1
            # 系统模块
            - id: amy-system
              uri: lb://amy-system
              predicates:
                - Path=/system/**
              filters:
                - StripPrefix=1
            # 文件服务
            - id: amy-file
              uri: lb://amy-file
              predicates:
                - Path=/file/**
              filters:
                - StripPrefix=1
            # 太阳宫艺术空间服务    
            - id: amy-biz-sun-palace-art-space
              uri: lb://amy-biz-sun-palace-art-space
              predicates:
                - Path=/spas/**
              filters:
                - StripPrefix=1    
                  
      # 兜底：即使再出现自循环，也只降级不会拖垮整机
      httpclient:
        connect-timeout: 5000
        response-timeout: 10s
        pool:
          type: FIXED
          max-connections: 500
          max-idle-time: 30000
          max-life-time: 60000

# 安全配置
security:
  # 验证码
  captcha:
    enabled: true
    type: math
  # 防止XSS攻击
  xss:
    enabled: true
    excludeUrls:
      - /system/notice
      - /spas/project/**

  # 不校验白名单
  ignore:
    whites:
      - /auth/logout
      - /auth/login
      - /auth/register
      - /*/v2/api-docs
      - /*/v3/api-docs
      - /csrf
      - /spas/mina/app/**
      

# springdoc配置
springdoc:
  webjars:
    # 访问前缀
    prefix:
