# 滑动拼图验证码（aj-captcha）：小程序端预约提交前人机校验
aj:
  captcha:
    # 验证码类型：滑动拼图
    type: blockPuzzle
    # 缓存类型：redis（多实例部署安全）；若仅单实例可改 local
    cache-type: redis
    # 右下角水印文字：留空关闭（核心包画进底图的文字无抗锯齿，放大后边缘锯齿、过于锐利）
    water-mark: ''
    # 滑动校验允许误差（像素）
    slip-offset: 5
    # 坐标 AES 加密
    aes-status: true
    # 滑块干扰项（0/1/2）
    interference-options: 1
    # 分钟级频控开关（开启后 /captcha/get、/captcha/check、verification 均受限流保护）
    req-frequency-limit-enable: true
    req-get-lock-limit: 5
    req-get-lock-seconds: 300
    req-get-minute-limit: 60
    req-check-minute-limit: 60
    req-verify-minute-limit: 60


wx:
  miniapp:
    # 小程序配置(必填)
    appid: wx5560514fdc2eea97
    secret: 3bf0ea0290eb8bfa857964844e8207f6
    token: f1d06df7ed8ce53f28f63fb41376cd6d
    aesKey: 56a331f13d3a09e62e9f95b0e25b2bf1
    # 消息格式，XML或者JSON.
    msgDataFormat: JSON
    # 是否使用稳定版 access_token，布尔值只能是 true/false
    use-stable-access-token: false

    # 存储配置redis(可选)
    # 注意: 指定redis.host值后不会使用容器注入的redis连接(JedisPool)
    # 配置类型: Memory(默认), Jedis, RedisTemplate
    # Jedis 需要额外引入 redis.clients:jedis 依赖，当前模块未引入，故使用 RedisTemplate
    config-storage:
      type: RedisTemplate
      # 相关redis前缀配置: wa(默认)
      key-prefix: wa
      redis:
        host: 127.0.0.1
        port: 6379

      # http客户端配置
      # http客户端类型: HttpClient(默认), OkHttp, JoddHttp
      http-client-type: HttpClient
      http-proxy-host:
      http-proxy-port:
      http-proxy-username:
      http-proxy-password:

# spring配置
spring:
  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    druid:
      stat-view-servlet:
        enabled: true
        loginUsername: root
        loginPassword: fansw!@#
    dynamic:
      druid:
        initial-size: 5
        min-idle: 5
        maxActive: 20
        maxWait: 60000
        connectTimeout: 30000
        socketTimeout: 60000
        timeBetweenEvictionRunsMillis: 60000
        minEvictableIdleTimeMillis: 300000
        validationQuery: SELECT 1 FROM DUAL
        testWhileIdle: true
        testOnBorrow: false
        testOnReturn: false
        poolPreparedStatements: true
        maxPoolPreparedStatementPerConnectionSize: 20
        filters: stat,slf4j
